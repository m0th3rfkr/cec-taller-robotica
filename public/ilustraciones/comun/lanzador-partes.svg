<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Partes del lanzador de tapas: motor, rueda con rampita, empujador con liga, tapa y diana</title>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f97316"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="796" height="356" rx="20" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>

  <!-- vista lateral: mesa -->
  <line x1="30" y1="260" x2="770" y2="260" stroke="#92602b" stroke-width="5"/>
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Vista desde un lado</text>

  <!-- motor -->
  <rect x="40" y="195" width="80" height="55" rx="8" fill="#9ca3af" stroke="#4b5563" stroke-width="2"/>
  <text x="80" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Motor</text>
  <line x1="120" y1="222" x2="140" y2="222" stroke="#4b5563" stroke-width="6"/>

  <!-- rueda con rampita -->
  <circle cx="165" cy="222" r="34" fill="#e0f2fe" stroke="#2563eb" stroke-width="4"/>
  <circle cx="165" cy="222" r="9" fill="#60a5fa" stroke="#1e3a8a" stroke-width="2"/>
  <path d="M165 188 L190 196 L165 200 z" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <path d="M130 200 A40 40 0 0 1 150 182" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#g)"/>
  <text x="165" y="285" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Rueda con rampita</text>

  <!-- riel -->
  <rect x="200" y="238" width="340" height="12" rx="3" fill="#e7c9a0" stroke="#92602b" stroke-width="2"/>
  <text x="370" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#92602b">Riel de cartón</text>

  <!-- cola -->
  <rect x="198" y="212" width="55" height="12" rx="3" fill="#bbf7d0" stroke="#166534" stroke-width="2"/>
  <text x="225" y="204" text-anchor="middle" font-size="14" fill="#166534">cola</text>
  <!-- empujador -->
  <rect x="253" y="204" width="34" height="34" rx="4" fill="#86efac" stroke="#166534" stroke-width="3"/>
  <text x="270" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Empujador</text>

  <!-- poste -->
  <rect x="470" y="198" width="10" height="40" rx="3" fill="#92602b"/>
  <text x="475" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#92602b">Poste</text>

  <!-- liga -->
  <path d="M287 214 Q380 190 470 214" fill="none" stroke="#f97316" stroke-width="4"/>
  <text x="380" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#c2410c">Liga</text>

  <!-- tope -->
  <rect x="320" y="214" width="8" height="24" rx="2" fill="#6b7280"/>
  <text x="324" y="206" text-anchor="middle" font-size="13" fill="#4b5563">tope</text>

  <!-- tapa -->
  <ellipse cx="305" cy="232" rx="13" ry="5" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <line x1="545" y1="246" x2="620" y2="246" stroke="#f97316" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#f)"/>
  <text x="590" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#c2410c">¡Tapa lanzada!</text>

  <!-- pista de medir -->
  <rect x="560" y="252" width="215" height="8" fill="#fde68a" stroke="#92602b" stroke-width="2"/>
  <g stroke="#92602b" stroke-width="2">
    <line x1="580" y1="252" x2="580" y2="268"/>
    <line x1="620" y1="252" x2="620" y2="268"/>
    <line x1="660" y1="252" x2="660" y2="268"/>
    <line x1="700" y1="252" x2="700" y2="268"/>
    <line x1="740" y1="252" x2="740" y2="268"/>
  </g>
  <text x="667" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Pista para medir</text>
  <text x="667" y="306" text-anchor="middle" font-size="13" fill="#4b5563">¿quién llega más lejos?</text>

  <!-- circuito -->
  <text x="400" y="320" text-anchor="middle" font-size="14" fill="#1f2937">Circuito con caimanes: pilas → interruptor → motor → pilas</text>
</svg>
