<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Partes del lanzador de discos: pilas, motor, rueda con liga, rampa y disco</title>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f97316"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="796" height="346" rx="20" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>

  <!-- caja -->
  <rect x="60" y="150" width="300" height="140" rx="10" fill="#e7c9a0" stroke="#92602b" stroke-width="3"/>
  <text x="140" y="275" text-anchor="middle" font-size="15" fill="#1f2937">Caja de cartón</text>

  <!-- pilas y motor dentro de la caja -->
  <rect x="80" y="190" width="90" height="36" rx="6" fill="#1f2937"/>
  <text x="125" y="213" text-anchor="middle" font-size="14" fill="#ffffff">2 pilas AA</text>
  <rect x="215" y="185" width="70" height="46" rx="8" fill="#9ca3af" stroke="#4b5563" stroke-width="2"/>
  <text x="250" y="213" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Motor</text>
  <line x1="170" y1="208" x2="215" y2="208" stroke="#1f2937" stroke-width="3"/>

  <!-- eje -->
  <line x1="285" y1="208" x2="400" y2="208" stroke="#4b5563" stroke-width="6"/>

  <!-- rueda (CD) -->
  <circle cx="400" cy="208" r="62" fill="#e0f2fe" stroke="#2563eb" stroke-width="4"/>
  <circle cx="400" cy="208" r="62" fill="none" stroke="#f97316" stroke-width="7" stroke-dasharray="3 0" opacity="0.9"/>
  <circle cx="400" cy="208" r="20" fill="#60a5fa" stroke="#1e3a8a" stroke-width="3"/>
  <text x="400" y="213" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">tapa</text>
  <path d="M458 150 A70 70 0 0 1 470 200" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#f)"/>
  <text x="400" y="298" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Rueda (CD)</text>
  <text x="400" y="318" text-anchor="middle" font-size="14" fill="#1f2937">con liga en el borde</text>

  <!-- rampa -->
  <line x1="330" y1="60" x2="398" y2="138" stroke="#92602b" stroke-width="10" stroke-linecap="round"/>
  <text x="290" y="56" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Rampa</text>
  <ellipse cx="345" cy="80" rx="15" ry="6" transform="rotate(48 345 80)" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-size="14" fill="#1f2937">el disco baja y toca la rueda</text>

  <!-- disco volando -->
  <line x1="475" y1="190" x2="660" y2="150" stroke="#f97316" stroke-width="4" marker-end="url(#f)" stroke-dasharray="8 6"/>
  <ellipse cx="700" cy="140" rx="16" ry="6" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <text x="650" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#c2410c">¡Disco disparado!</text>

  <!-- porteria -->
  <rect x="660" y="240" width="110" height="50" rx="6" fill="#fef3c7" stroke="#92602b" stroke-width="3"/>
  <text x="715" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Portería</text>
