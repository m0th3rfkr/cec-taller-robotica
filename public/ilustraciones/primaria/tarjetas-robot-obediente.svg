<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Tarjetas del juego robot obediente</title>
  <defs>
    <marker id="punta" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="30" markerHeight="30" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="seq" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="796" height="336" rx="20" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="400" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Un programa: el robot hace las tarjetas en orden</text>

  <!-- tarjeta 1: adelante -->
  <rect x="40" y="70" width="150" height="200" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <text x="115" y="98" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">1</text>
  <line x1="115" y1="220" x2="115" y2="130" stroke="#1f2937" stroke-width="10" stroke-linecap="round" marker-end="url(#punta)"/>
  <text x="115" y="255" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">Adelante</text>

  <!-- tarjeta 2: adelante -->
  <rect x="230" y="70" width="150" height="200" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <text x="305" y="98" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">2</text>
  <line x1="305" y1="220" x2="305" y2="130" stroke="#1f2937" stroke-width="10" stroke-linecap="round" marker-end="url(#punta)"/>
  <text x="305" y="255" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">Adelante</text>

  <!-- tarjeta 3: gira -->
  <rect x="420" y="70" width="150" height="200" rx="14" fill="#ffedd5" stroke="#f97316" stroke-width="4"/>
  <text x="495" y="98" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3412">3</text>
  <path d="M463 185 A32 32 0 1 1 495 217" fill="none" stroke="#1f2937" stroke-width="9" stroke-linecap="round"/>
  <polygon points="497,203 497,231 474,217" fill="#1f2937"/>
  <text x="495" y="255" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">Gira</text>

  <!-- tarjeta 4: brazo arriba -->
  <rect x="610" y="70" width="150" height="200" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
  <text x="685" y="98" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">4</text>
  <circle cx="685" cy="150" r="16" fill="#fef3c7" stroke="#1f2937" stroke-width="4"/>
  <line x1="685" y1="166" x2="685" y2="215" stroke="#1f2937" stroke-width="8" stroke-linecap="round"/>
  <line x1="685" y1="180" x2="725" y2="140" stroke="#1f2937" stroke-width="8" stroke-linecap="round"/>
  <line x1="685" y1="180" x2="660" y2="218" stroke="#1f2937" stroke-width="8" stroke-linecap="round"/>
  <text x="685" y="255" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">Brazo arriba</text>

  <!-- flechas de secuencia -->
  <line x1="194" y1="170" x2="226" y2="170" stroke="#6b7280" stroke-width="4" marker-end="url(#seq)"/>
  <line x1="384" y1="170" x2="416" y2="170" stroke="#6b7280" stroke-width="4" marker-end="url(#seq)"/>
  <line x1="574" y1="170" x2="606" y2="170" stroke="#6b7280" stroke-width="4" marker-end="url(#seq)"/>

  <text x="400" y="312" text-anchor="middle" font-size="18" fill="#1f2937">Si el robot se equivoca, busca qué tarjeta estaba mal y corrígela.</text>
</svg>
