<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Montaje para clasificar objetos con la IA y el brazo</title>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f97316"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="796" height="346" rx="20" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>

  <!-- encabezados -->
  <text x="145" y="42" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Sentir y pensar</text>
  <text x="145" y="62" text-anchor="middle" font-size="15" fill="#1f2937">la cámara y la IA</text>
  <text x="345" y="42" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">Actuar</text>
  <text x="345" y="62" text-anchor="middle" font-size="15" fill="#1f2937">el brazo empuja</text>
  <text x="600" y="42" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Los botes</text>

  <!-- laptop -->
  <rect x="40" y="80" width="210" height="140" rx="8" fill="#1f2937"/>
  <circle cx="145" cy="88" r="3" fill="#60a5fa"/>
  <rect x="50" y="96" width="190" height="116" rx="4" fill="#f8fafc"/>
  <text x="145" y="144" text-anchor="middle" font-size="26" font-weight="700" fill="#1e3a8a">Plástico</text>
  <rect x="75" y="162" width="140" height="14" rx="7" fill="#e5e7eb"/>
  <rect x="75" y="162" width="133" height="14" rx="7" fill="#16a34a"/>
  <text x="145" y="198" text-anchor="middle" font-size="16" fill="#1f2937">95% seguro</text>
  <rect x="20" y="220" width="250" height="14" rx="7" fill="#9ca3af"/>

  <!-- mesa -->
  <line x1="290" y1="290" x2="780" y2="290" stroke="#92602b" stroke-width="5"/>

  <!-- brazo -->
  <rect x="290" y="256" width="46" height="20" rx="5" fill="#e8c48f" stroke="#92602b" stroke-width="3"/>
  <rect x="270" y="244" width="24" height="46" rx="4" fill="#d6a96b" stroke="#92602b" stroke-width="3"/>

  <!-- botella (objeto) -->
  <rect x="345" y="224" width="38" height="66" rx="9" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/>
  <rect x="356" y="204" width="16" height="22" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/>
  <rect x="353" y="194" width="22" height="12" rx="3" fill="#2563eb"/>

  <!-- flecha de empuje -->
  <path d="M370 188 Q490 100 598 186" fill="none" stroke="#f97316" stroke-width="6" stroke-dasharray="10 8" marker-end="url(#f)"/>

  <!-- botes -->
  <polygon points="470,200 530,200 522,290 478,290" fill="#d6a96b" stroke="#92602b" stroke-width="4"/>
  <polygon points="570,200 630,200 622,290 578,290" fill="#93c5fd" stroke="#16a34a" stroke-width="6"/>
  <polygon points="670,200 730,200 722,290 678,290" fill="#d1d5db" stroke="#6b7280" stroke-width="4"/>
  <text x="500" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Cartón</text>
  <text x="600" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">Plástico ✓</text>
  <text x="700" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Metal</text>
</svg>
