<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Cableado del servo al Arduino</title>
  <rect x="2" y="2" width="796" height="436" rx="20" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>

  <!-- placa Arduino (esquema simplificado) -->
  <rect x="40" y="70" width="300" height="270" rx="14" fill="#0e7490" stroke="#164e63" stroke-width="5"/>
  <rect x="30" y="110" width="60" height="72" rx="4" fill="#d1d5db" stroke="#6b7280" stroke-width="3"/>
  <text x="60" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">USB</text>
  <text x="200" y="215" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">ARDUINO UNO</text>
  <text x="200" y="242" text-anchor="middle" font-size="15" fill="#cffafe">(esquema simplificado)</text>

  <!-- pines digitales (arriba) -->
  <g fill="#1f2937">
    <rect x="150" y="74" width="20" height="22" rx="3"/>
    <rect x="186" y="74" width="20" height="22" rx="3"/>
    <rect x="222" y="74" width="20" height="22" rx="3" fill="#f97316"/>
    <rect x="258" y="74" width="20" height="22" rx="3"/>
    <rect x="294" y="74" width="20" height="22" rx="3"/>
  </g>
  <g font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="160" y="118">7</text>
    <text x="196" y="118">8</text>
    <text x="232" y="118" fill="#fed7aa" font-size="17">9</text>
    <text x="268" y="118">10</text>
    <text x="304" y="118">11</text>
  </g>

  <!-- pines de energía (abajo) -->
  <g fill="#1f2937">
    <rect x="160" y="316" width="20" height="22" rx="3" fill="#dc2626"/>
    <rect x="196" y="316" width="20" height="22" rx="3" fill="#92400e"/>
  </g>
  <g font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="170" y="306">5V</text>
    <text x="206" y="306">GND</text>
  </g>

  <!-- cables -->
  <g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M232 74 V40 H480 V185 H534" stroke="#f97316"/>
    <path d="M206 338 V382 H470 V205 H534" stroke="#92400e"/>
    <path d="M170 338 V400 H490 V225 H534" stroke="#dc2626"/>
  </g>

  <!-- servo -->
  <rect x="528" y="172" width="16" height="64" rx="3" fill="#1f2937"/>
  <rect x="544" y="160" width="150" height="88" rx="10" fill="#3b82f6" stroke="#1e3a8a" stroke-width="4"/>
  <circle cx="664" cy="204" r="22" fill="#ffffff" stroke="#1e3a8a" stroke-width="4"/>
  <rect x="660" y="176" width="8" height="30" rx="3" fill="#e5e7eb" stroke="#1e3a8a" stroke-width="2"/>
  <text x="598" y="210" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">SERVO</text>
  <text x="598" y="232" text-anchor="middle" font-size="14" fill="#dbeafe">SG90</text>

  <!-- leyenda -->
  <g font-size="17" fill="#1f2937">
    <rect x="530" y="290" width="22" height="12" rx="3" fill="#f97316"/>
    <text x="562" y="302">Señal (naranja) → pin 9</text>
    <rect x="530" y="318" width="22" height="12" rx="3" fill="#92400e"/>
    <text x="562" y="330">GND (café) → GND</text>
    <rect x="530" y="346" width="22" height="12" rx="3" fill="#dc2626"/>
    <text x="562" y="358">Alimentación (rojo) → 5V</text>
  </g>

  <text x="400" y="427" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3412">Conecta los cables antes de enchufar el USB.</text>
</svg>
