<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Diagrama del sistema: cámara, IA, Arduino, servo, embudo y bote</title>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="796" height="316" rx="20" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>

  <!-- llaves superiores -->
  <g font-size="17" font-weight="700" text-anchor="middle">
    <line x1="30" y1="62" x2="150" y2="62" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
    <text x="90" y="48" fill="#1e3a8a">SENTIR</text>
    <line x1="190" y1="62" x2="330" y2="62" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
    <text x="260" y="48" fill="#9a3412">PENSAR</text>
    <line x1="370" y1="62" x2="640" y2="62" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
    <text x="505" y="48" fill="#166534">ACTUAR</text>
  </g>

  <!-- cajas -->
  <rect x="30" y="90" width="120" height="100" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <rect x="60" y="120" width="60" height="38" rx="8" fill="#1f2937"/>
  <circle cx="90" cy="139" r="12" fill="#ffffff" stroke="#9ca3af" stroke-width="3"/>
  <circle cx="90" cy="139" r="5" fill="#2563eb"/>
  <text x="90" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Cámara</text>

  <rect x="190" y="90" width="140" height="100" rx="14" fill="#ffedd5" stroke="#f97316" stroke-width="4"/>
  <circle cx="260" cy="125" r="20" fill="none" stroke="#f97316" stroke-width="9" stroke-dasharray="7 7"/>
  <circle cx="260" cy="125" r="14" fill="#f97316"/>
  <circle cx="260" cy="125" r="5" fill="#ffffff"/>
  <text x="260" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">IA en el</text>
  <text x="260" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">navegador</text>

  <rect x="370" y="90" width="120" height="100" rx="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="4"/>
  <rect x="396" y="112" width="68" height="40" rx="5" fill="#0e7490"/>
  <rect x="404" y="106" width="52" height="8" fill="#9ca3af"/>
  <text x="430" y="177" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Arduino</text>

  <rect x="530" y="90" width="110" height="100" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
  <rect x="552" y="108" width="66" height="30" rx="4" fill="#3b82f6" stroke="#1e3a8a" stroke-width="3"/>
  <circle cx="585" cy="138" r="7" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
  <rect x="577" y="142" width="16" height="14" fill="#e8c48f" stroke="#92602b" stroke-width="2"/>
  <text x="585" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Servo +</text>
  <text x="585" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">embudo</text>

  <polygon points="690,120 740,120 732,190 698,190" fill="#d6a96b" stroke="#92602b" stroke-width="4"/>
  <text x="715" y="212" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Bote</text>

  <!-- flechas -->
  <line x1="154" y1="140" x2="186" y2="140" stroke="#1f2937" stroke-width="4" marker-end="url(#f)"/>
  <line x1="334" y1="140" x2="366" y2="140" stroke="#1f2937" stroke-width="4" marker-end="url(#f)"/>
  <line x1="494" y1="140" x2="526" y2="140" stroke="#1f2937" stroke-width="4" marker-end="url(#f)"/>
  <line x1="644" y1="140" x2="686" y2="140" stroke="#1f2937" stroke-width="4" marker-end="url(#f)"/>

  <!-- qué viaja -->
  <g font-size="15" fill="#1f2937" text-anchor="middle">
    <text x="90" y="244">ve el objeto</text>
    <text x="260" y="244">dice: 1 cartón,</text>
    <text x="260" y="264">2 plástico, 3 metal</text>
    <text x="430" y="244">recibe '1', '2' o '3'</text>
    <text x="430" y="264">por cable USB</text>
    <text x="585" y="244">gira a 20°, 90°</text>
    <text x="585" y="264">o 160°</text>
    <text x="715" y="244">recibe el objeto</text>
  </g>
</svg>
